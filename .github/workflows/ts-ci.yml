name: TypeScript CI

on:
  pull_request:
    paths:
      - 'impl/ts/**'
      - 'spec/**'
      - '.github/workflows/ts-ci.yml'
  push:
    branches: [main]
    paths:
      - 'impl/ts/**'
      - 'spec/**'
      - '.github/workflows/ts-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify test vectors
        run: |
          npm run vectors
          git diff --exit-code -- ../../spec
          test -z "$(git ls-files --others --exclude-standard -- ../../spec)"
      - run: npm run check-pack
      - run: npx --yes jsr@0.14.3 publish --dry-run
